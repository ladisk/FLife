name: Create a Release on Tag

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-python@v7
      with:
        python-version: "3.14"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .[dev,gui]

    - name: Test with pytest
      env:
        QT_QPA_PLATFORM: offscreen
      run: pytest

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub release
      id-token: write   # PyPI trusted publishing

    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-python@v7
      with:
        python-version: "3.14"

    - name: Install dependencies
      run: pip install build

    - name: Check that the tag matches the package version
      run: |
        TAG_VERSION="${GITHUB_REF#refs/tags/v}"
        PKG_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
        INIT_VERSION=$(python -c "import re; print(re.search(r'__version__\s*=\s*[\'\"]([^\'\"]+)', open('FLife/__init__.py').read()).group(1))")
        echo "tag: $TAG_VERSION, pyproject.toml: $PKG_VERSION, FLife/__init__.py: $INIT_VERSION"
        if [ "$TAG_VERSION" != "$PKG_VERSION" ] || [ "$TAG_VERSION" != "$INIT_VERSION" ]; then
          echo "::error::Tag v$TAG_VERSION does not match the package version. Run 'python sync_version.py --set-version $TAG_VERSION', commit, and tag that commit."
          exit 1
        fi

    - name: Build distribution
      run: python -m build

    - name: Create GitHub Release and upload artifacts
      uses: softprops/action-gh-release@v3
      with:
        files: dist/*.whl

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
